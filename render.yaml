# Blueprint Render — https://render.com/docs/blueprint-spec
# Déploiement : Dashboard → New → Blueprint → repo GitHub.
# Après le 1er déploiement : renseigner OAUTH_FACEBOOK_* dans l’env du service web.
#
# Worker prod : self-hosted (npm run worker:prod + .env.worker.prod sur votre machine).
# Redis externe : Dashboard → sondage-redis → Access Control → IP statique du worker (/32).
# Ne pas committer d’IP dans ce fichier.

databases:
  - name: sondage-db
    databaseName: sondage
    user: sondage
    plan: basic-256mb
    region: frankfurt

services:
  - type: redis
    name: sondage-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    # Accès externe pour le worker self-hosted : ajouter l’IP /32 dans le Dashboard Render
    # (ipAllowList vide = réseau privé Render uniquement).
    ipAllowList: []

  - type: web
    name: sondage
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: ./scripts/render-build.sh
    # Plan free : pas de preDeployCommand — migrations dans render-start-api.sh
    startCommand: ./scripts/render-start-api.sh
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sondage-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sondage-redis
          property: connectionString
      - key: DEFAULT_DATA_REGION
        value: EU
      - key: COMPLIANCE_MODE
        value: prototype
      - key: ENABLED_PLATFORMS
        value: facebook
      - key: JWT_SECRET
        generateValue: true
      - key: PARTICIPATION_HASH_SALT
        generateValue: true
      # PUBLIC_BASE_URL : optionnel — RENDER_EXTERNAL_URL par défaut
      # - key: PUBLIC_BASE_URL
      #   value: https://<votre-service>.onrender.com
      # À configurer manuellement dans le Dashboard Render :
      # - key: OAUTH_FACEBOOK_APP_ID
      #   sync: false
      # - key: OAUTH_FACEBOOK_APP_SECRET
      #   sync: false
