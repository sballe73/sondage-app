<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Démo widget — Sondage MJ</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .sondage-widget fieldset {
        margin: 1rem 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 1rem;
      }
      .sondage-widget label {
        margin-right: 0.75rem;
      }
      .sondage-widget button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
      }
      .sondage-widget .grade-options {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .sondage-widget .grade-option {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        cursor: pointer;
      }
      .sondage-widget .grade-num {
        font-weight: 600;
        min-width: 1.25rem;
      }
      .sondage-widget .grade-label {
        color: #333;
      }
      .sondage-widget .oauth-login-btn {
        display: inline-block;
        padding: 0.6rem 1.2rem;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
        font-weight: 600;
      }
      .sondage-widget .oauth-login-btn--google {
        background: #4285f4;
      }
      .sondage-widget .oauth-login-btn--google:hover {
        background: #3367d6;
      }
      .sondage-widget .oauth-login-btn--x {
        background: #0f1419;
      }
      .sondage-widget .oauth-login-btn--x:hover {
        background: #272c30;
      }
      .sondage-widget .oauth-login-btn--facebook {
        background: #1877f2;
      }
      .sondage-widget .oauth-login-btn--facebook:hover {
        background: #166fe5;
      }
    </style>
    <script src="sondage-datetime.js"></script>
    <script src="sondage-widget.js"></script>
  </head>
  <body>
    <h1>Démo embed</h1>
    <p id="help"></p>
    <p id="results-link" style="display: none">
      <a id="results-anchor" href="#">Voir les résultats</a>
    </p>
    <div id="widget-host"></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var pollId = params.get("pollId");
        var help = document.getElementById("help");
        var host = document.getElementById("widget-host");

        if (!pollId) {
          help.innerHTML =
            "Ajoutez <code>?pollId=</code> à l’URL avec l’UUID affiché par <code>npm run db:seed</code> :<br><code>http://localhost:3000/embed/demo.html?pollId=VOTRE-UUID</code>";
          return;
        }

        help.textContent = "Sondage : " + pollId;

        var resultsLink = document.getElementById("results-link");
        var resultsAnchor = document.getElementById("results-anchor");
        resultsAnchor.href =
          "results.html?pollId=" + encodeURIComponent(pollId);
        resultsLink.style.display = "block";

        var widget = document.createElement("sondage-poll-widget");
        widget.setAttribute("data-poll-id", pollId);
        widget.setAttribute("data-api-base", window.location.origin);
        /* data-platform omis : le widget utilise poll.platform (mock ou google) */
        host.appendChild(widget);
      })();
    </script>
  </body>
</html>
