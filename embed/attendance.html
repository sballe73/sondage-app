<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Redirection — Feuille d'émargement</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var pollId = params.get("pollId");
        var target = "creator.html";
        if (pollId) {
          target += "?pollId=" + encodeURIComponent(pollId);
        }
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirection vers la page créateur…</p>
  </body>
</html>
