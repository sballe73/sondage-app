<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script src="sondage-theme-init.js"></script>
    <link rel="stylesheet" href="sondage-theme.css" />
    <title>Créateur — Sondage MJ</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: var(--text);
        background: var(--bg);
      }
      .page-nav {
        margin-bottom: 1.5rem;
      }
      .page-nav a {
        color: var(--primary);
        margin-right: 1rem;
      }
      .sondage-creator fieldset {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin: 0 0 1.25rem;
      }
      .sondage-creator legend {
        font-weight: 600;
        padding: 0 0.25rem;
        color: var(--text);
      }
      .sondage-creator label {
        display: block;
        margin-bottom: 0.75rem;
        font-size: 0.9rem;
        color: var(--text);
      }
      .sondage-creator input[type="text"],
      .sondage-creator input[type="datetime-local"],
      .sondage-creator select,
      .sondage-creator textarea {
        display: block;
        width: 100%;
        margin-top: 0.25rem;
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--input-border);
        border-radius: 6px;
        font: inherit;
        box-sizing: border-box;
        background: var(--input-bg);
        color: var(--input-text);
      }
      .sondage-creator .hint {
        color: var(--text-muted);
        font-size: 0.85rem;
        margin: 0 0 0.75rem;
      }
      body > .hint {
        color: var(--text-muted);
      }
      .sondage-creator .candidate-row {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .sondage-creator .candidate-row input {
        flex: 1;
        margin-top: 0;
      }
      .sondage-creator .btn-remove {
        width: 2.25rem;
        padding: 0;
        cursor: pointer;
        border: 1px solid var(--btn-secondary-border);
        border-radius: 6px;
        background: var(--btn-secondary-bg);
        color: var(--btn-secondary-text);
        font-size: 1.1rem;
        line-height: 1;
      }
      .sondage-creator .btn-primary,
      .sondage-creator .btn-secondary,
      .sondage-creator .btn-copy {
        padding: 0.45rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
      }
      .sondage-creator .btn-primary {
        background: var(--primary);
        color: var(--on-primary);
        border: none;
      }
      .sondage-creator .btn-primary:hover {
        background: var(--primary-hover);
      }
      .sondage-creator .btn-primary:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .sondage-creator .btn-secondary {
        background: var(--btn-secondary-bg);
        color: var(--btn-secondary-text);
        border: 1px solid var(--btn-secondary-border);
      }
      .sondage-creator .btn-secondary:hover {
        background: var(--surface-hover);
      }
      .sondage-creator .error {
        color: var(--error);
        margin: 0.5rem 0;
      }
      .sondage-creator .success-banner {
        background: var(--success-bg);
        border: 1px solid var(--success-border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-bottom: 1.25rem;
        color: var(--success-text);
      }
      .sondage-creator .success-banner h2 {
        margin: 0 0 0.5rem;
        color: var(--success-text);
      }
      .sondage-creator .poll-id code {
        font-size: 0.85rem;
        word-break: break-all;
        background: var(--code-bg);
        color: var(--text);
        padding: 0.15rem 0.35rem;
        border-radius: 4px;
      }
      .sondage-creator .links-panel,
      .sondage-creator .status-panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-bottom: 1.25rem;
        background: var(--surface);
        color: var(--text);
      }
      .sondage-creator .links-panel h3,
      .sondage-creator .status-panel h3 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
        color: var(--text);
      }
      .sondage-creator .copy-field {
        margin-bottom: 1rem;
      }
      .sondage-creator .copy-field label {
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      .sondage-creator .copy-row {
        display: flex;
        gap: 0.5rem;
        align-items: flex-start;
      }
      .sondage-creator .copy-row input,
      .sondage-creator .copy-row textarea {
        flex: 1;
        margin-top: 0;
        font-size: 0.85rem;
      }
      .sondage-creator .btn-copy {
        white-space: nowrap;
        background: var(--btn-copy-bg);
        color: var(--btn-secondary-text);
        border: 1px solid var(--btn-secondary-border);
      }
      .sondage-creator .status-dl {
        display: grid;
        grid-template-columns: 9rem 1fr;
        gap: 0.35rem 1rem;
        margin: 0;
        font-size: 0.9rem;
      }
      .sondage-creator .status-dl dt {
        color: var(--text-muted);
        margin: 0;
      }
      .sondage-creator .status-dl dd {
        margin: 0;
        color: var(--text);
      }
      .sondage-creator .creator-footer {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .sondage-creator .date-edit-row input[type="datetime-local"] {
        margin-bottom: 0.5rem;
      }
      .sondage-creator .date-now-option {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
      }
      .sondage-creator .date-now-option input {
        width: auto;
        margin: 0;
      }
      .sondage-creator .btn-save-date {
        margin-bottom: 0.35rem;
      }
      .sondage-creator .oauth-login-btn {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        color: #fff;
      }
      .sondage-creator .oauth-login-btn--google {
        background: #4285f4;
      }
      .sondage-creator .oauth-login-btn--facebook {
        background: #1877f2;
      }
      .sondage-creator .oauth-login-buttons {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-start;
        margin-top: 0.5rem;
      }
    </style>
    <script src="sondage-auth-storage.js"></script>
    <script src="sondage-shell.js"></script>
    <script src="sondage-datetime.js"></script>
    <script src="sondage-creator.js"></script>
  </head>
  <body>
    <h1>Créer un sondage</h1>
    <p class="hint">
      Configurez un sondage MJ sans curl. L’identifiant créateur est libre en
      mode <strong>mock</strong> uniquement (<code>local-dev</code> par défaut) ;
      pour les autres plateformes, connectez-vous via OAuth.
    </p>
    <div id="creator-host"></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var pollId = params.get("pollId");
        var host = document.getElementById("creator-host");
        var widget = document.createElement("sondage-creator-widget");
        widget.setAttribute("data-api-base", window.location.origin);
        widget.setAttribute("data-data-region", "EU");
        if (pollId) {
          widget.setAttribute("data-poll-id", pollId);
        }
        host.appendChild(widget);
        SondageShell.init({ active: "creator" });
      })();
    </script>
  </body>
</html>
