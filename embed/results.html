<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Résultats — Sondage MJ</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      .nav-links {
        margin-bottom: 1.5rem;
      }
      .nav-links a {
        color: #2563eb;
      }
      .sondage-results .results-header h2 {
        margin: 0 0 0.25rem;
      }
      .sondage-results .meta {
        color: #555;
        margin: 0 0 1rem;
      }
      .sondage-results .notice {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin: 1rem 0;
      }
      .sondage-results .notice h3 {
        margin: 0 0 0.5rem;
        font-size: 1.1rem;
      }
      .sondage-results .notice p {
        margin: 0.35rem 0;
      }
      .sondage-results .tie-break-info {
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        margin: 1rem 0;
        font-size: 0.9rem;
        line-height: 1.45;
      }
      .sondage-results .live-vote-notice {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        margin: 0 0 1rem;
        font-size: 0.9rem;
        line-height: 1.45;
        color: #1e40af;
      }
      .sondage-results .poll-ended-banner {
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 8px;
        padding: 0.85rem 1rem;
        margin: 0 0 1rem;
        font-size: 0.95rem;
        line-height: 1.45;
        color: #991b1b;
      }
      .sondage-results .poll-ended-label {
        display: block;
        font-weight: 700;
        margin-bottom: 0.25rem;
      }
      .sondage-results .poll-ended-detail {
        color: #7f1d1d;
      }
      .sondage-results .ranking-table {
        width: 100%;
        border-collapse: collapse;
        margin: 0.5rem 0 1.5rem;
      }
      .sondage-results .ranking-table th,
      .sondage-results .ranking-table td {
        text-align: left;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid #e5e7eb;
      }
      .sondage-results .ranking-table th {
        font-weight: 600;
        color: #374151;
      }
      .sondage-results .ranking-table .rank {
        width: 3rem;
        font-weight: 700;
        color: #2563eb;
      }
      .sondage-results .ranking-table .median {
        font-size: 0.92rem;
      }
      .sondage-results .distribution-section h3 {
        margin-top: 2rem;
      }
      .sondage-results .hint {
        color: #6b7280;
        font-size: 0.875rem;
        margin: 0 0 1rem;
      }
      .sondage-results .distribution-grid-wrap {
        overflow-x: auto;
        margin: 0 0 1.5rem;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }
      .sondage-results .distribution-grid {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        min-width: 36rem;
      }
      .sondage-results .distribution-grid th,
      .sondage-results .distribution-grid td {
        padding: 0.5rem 0.45rem;
        border: 1px solid #e5e7eb;
        vertical-align: middle;
      }
      .sondage-results .distribution-grid thead th {
        background: #f9fafb;
        font-weight: 600;
        text-align: center;
      }
      .sondage-results .distribution-grid .candidate-col {
        text-align: left;
        min-width: 8rem;
      }
      .sondage-results .distribution-grid .candidate-label {
        text-align: left;
        font-weight: 600;
        background: #fff;
        min-width: 9rem;
      }
      .sondage-results .distribution-grid .candidate-name {
        display: block;
      }
      .sondage-results .distribution-grid .candidate-median {
        display: block;
        margin-top: 0.2rem;
        font-size: 0.78rem;
        font-weight: 400;
        color: #6b7280;
      }
      .sondage-results .distribution-grid .grade-col {
        min-width: 4.5rem;
        line-height: 1.25;
      }
      .sondage-results .distribution-grid .grade-num {
        display: block;
        font-size: 0.95rem;
      }
      .sondage-results .distribution-grid .grade-lab {
        display: block;
        font-size: 0.68rem;
        font-weight: 500;
        color: #6b7280;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 5.5rem;
      }
      .sondage-results .distribution-grid .distribution-cell {
        text-align: center;
        font-variant-numeric: tabular-nums;
        color: #1f2937;
        transition: background-color 0.2s ease;
      }
      .sondage-results .distribution-grid .distribution-cell.is-empty {
        color: #9ca3af;
        background: #fafafa !important;
      }
      .sondage-results .distribution-grid .cell-sep {
        color: #9ca3af;
      }
      .sondage-results .distribution-grid .cell-pct {
        font-size: 0.78rem;
        color: #4b5563;
      }
      .sondage-results .distribution-grid thead .grade-1 { color: #16a34a; }
      .sondage-results .distribution-grid thead .grade-2 { color: #22c55e; }
      .sondage-results .distribution-grid thead .grade-3 { color: #84cc16; }
      .sondage-results .distribution-grid thead .grade-4 { color: #ca8a04; }
      .sondage-results .distribution-grid thead .grade-5 { color: #f97316; }
      .sondage-results .distribution-grid thead .grade-6 { color: #ef4444; }
      .sondage-results .distribution-grid thead .grade-7 { color: #b91c1c; }
      .sondage-results .results-footer {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid #e5e7eb;
      }
      .sondage-results .results-footer button {
        padding: 0.45rem 1rem;
        cursor: pointer;
      }
      .sondage-results .auto-hint {
        font-size: 0.8rem;
        color: #6b7280;
      }
      .sondage-results .error {
        color: #b91c1c;
      }
    </style>
    <script src="sondage-datetime.js"></script>
    <script src="sondage-results.js"></script>
  </head>
  <body>
    <nav class="nav-links" id="nav"></nav>
    <h1>Résultats du sondage</h1>
    <p id="help"></p>
    <div id="results-host"></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var pollId = params.get("pollId");
        var help = document.getElementById("help");
        var nav = document.getElementById("nav");
        var host = document.getElementById("results-host");

        if (!pollId) {
          help.innerHTML =
            "Ajoutez <code>?pollId=</code> à l’URL avec l’UUID affiché par <code>npm run db:seed</code> :<br><code>http://localhost:3000/embed/results.html?pollId=VOTRE-UUID</code>";
          return;
        }

        nav.innerHTML =
          '<a href="demo.html?pollId=' +
          encodeURIComponent(pollId) +
          '">← Retour au vote</a>';

        help.textContent = "Sondage : " + pollId;

        var widget = document.createElement("sondage-results-widget");
        widget.setAttribute("data-poll-id", pollId);
        widget.setAttribute("data-api-base", window.location.origin);
        widget.setAttribute("data-data-region", "EU");

        widget.addEventListener("sondage-poll-status", function (ev) {
          var ended = ev.detail && ev.detail.ended;
          if (ended) {
            nav.innerHTML =
              '<a href="creator.html?pollId=' +
              encodeURIComponent(pollId) +
              '">← Créateur</a>';
            document.title = "Résultats finaux — Sondage MJ";
            var h1 = document.querySelector("h1");
            if (h1) h1.textContent = "Résultats finaux";
          } else {
            nav.innerHTML =
              '<a href="demo.html?pollId=' +
              encodeURIComponent(pollId) +
              '">← Retour au vote</a>';
          }
        });

        host.appendChild(widget);
      })();
    </script>
  </body>
</html>
