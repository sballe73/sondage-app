<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script src="sondage-theme-init.js"></script>
    <link rel="stylesheet" href="sondage-theme.css" />
    <title>Résultats — Sondage MJ</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: var(--text);
        background: var(--bg);
      }
      .nav-links {
        margin-bottom: 1.5rem;
      }
      .nav-links a {
        color: var(--primary);
      }
      .sondage-results .results-header h2 {
        margin: 0 0 0.25rem;
        color: var(--text);
      }
      .sondage-results .meta {
        color: var(--text-muted);
        margin: 0 0 1rem;
      }
      .sondage-results .notice {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin: 1rem 0;
        color: var(--text);
      }
      .sondage-results .notice h3 {
        margin: 0 0 0.5rem;
        font-size: 1.1rem;
        color: var(--text);
      }
      .sondage-results .notice p {
        margin: 0.35rem 0;
        color: var(--text-muted);
      }
      .sondage-results .tie-break-info {
        background: var(--warning-bg);
        border: 1px solid var(--warning-border);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        margin: 1rem 0;
        font-size: 0.9rem;
        line-height: 1.45;
        color: var(--text);
      }
      .sondage-results .live-vote-notice {
        background: var(--info-bg);
        border: 1px solid var(--info-border);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        margin: 0 0 1rem;
        font-size: 0.9rem;
        line-height: 1.45;
        color: var(--info-text);
      }
      .sondage-results .poll-ended-banner {
        background: var(--error-bg);
        border: 1px solid var(--error-border);
        border-radius: 8px;
        padding: 0.85rem 1rem;
        margin: 0 0 1rem;
        font-size: 0.95rem;
        line-height: 1.45;
        color: var(--error-text);
      }
      .sondage-results .poll-ended-label {
        display: block;
        font-weight: 700;
        margin-bottom: 0.25rem;
      }
      .sondage-results .poll-ended-detail {
        color: var(--poll-ended-detail);
      }
      .sondage-results .ranking-table {
        width: 100%;
        border-collapse: collapse;
        margin: 0.5rem 0 1.5rem;
        color: var(--text);
      }
      .sondage-results .ranking-table th,
      .sondage-results .ranking-table td {
        text-align: left;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--border);
      }
      .sondage-results .ranking-table th {
        font-weight: 600;
        color: var(--heading-table);
      }
      .sondage-results .ranking-table .rank {
        width: 3rem;
        font-weight: 700;
        color: var(--primary);
      }
      .sondage-results .ranking-table .median {
        font-size: 0.92rem;
      }
      .sondage-results .distribution-section h3 {
        margin-top: 2rem;
        color: var(--text);
      }
      .sondage-results .hint {
        color: var(--text-subtle);
        font-size: 0.875rem;
        margin: 0 0 1rem;
      }
      .sondage-results .distribution-grid-wrap {
        overflow-x: auto;
        margin: 0 0 1.5rem;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .sondage-results .distribution-grid {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        min-width: 36rem;
        color: var(--text);
      }
      .sondage-results .distribution-grid th,
      .sondage-results .distribution-grid td {
        padding: 0.5rem 0.45rem;
        border: 1px solid var(--border);
        vertical-align: middle;
      }
      .sondage-results .distribution-grid thead th {
        background: var(--table-header-bg);
        font-weight: 600;
        text-align: center;
        color: var(--text);
      }
      .sondage-results .distribution-grid .candidate-col {
        text-align: left;
        min-width: 8rem;
      }
      .sondage-results .distribution-grid .candidate-label {
        text-align: left;
        font-weight: 600;
        background: var(--surface);
        color: var(--text);
        min-width: 9rem;
      }
      .sondage-results .distribution-grid .candidate-name {
        display: block;
      }
      .sondage-results .distribution-grid .candidate-median {
        display: block;
        margin-top: 0.2rem;
        font-size: 0.78rem;
        font-weight: 400;
        color: var(--text-subtle);
      }
      .sondage-results .distribution-grid .grade-col {
        min-width: 4.5rem;
        line-height: 1.25;
      }
      .sondage-results .distribution-grid .grade-num {
        display: block;
        font-size: 0.95rem;
      }
      .sondage-results .distribution-grid .grade-lab {
        display: block;
        font-size: 0.68rem;
        font-weight: 500;
        color: var(--text-subtle);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 5.5rem;
      }
      .sondage-results .distribution-grid .distribution-cell {
        text-align: center;
        font-variant-numeric: tabular-nums;
        color: var(--cell-data-text);
        transition: background-color 0.2s ease;
      }
      .sondage-results .distribution-grid .distribution-cell.is-empty {
        color: var(--cell-empty-text);
        background: var(--cell-empty-bg) !important;
      }
      .sondage-results .distribution-grid .cell-sep {
        color: var(--cell-empty-text);
      }
      .sondage-results .distribution-grid .cell-pct {
        font-size: 0.78rem;
        color: var(--cell-pct-text);
      }
      .sondage-results .distribution-grid thead .grade-1 { color: #16a34a; }
      .sondage-results .distribution-grid thead .grade-2 { color: #22c55e; }
      .sondage-results .distribution-grid thead .grade-3 { color: #84cc16; }
      .sondage-results .distribution-grid thead .grade-4 { color: #ca8a04; }
      .sondage-results .distribution-grid thead .grade-5 { color: #f97316; }
      .sondage-results .distribution-grid thead .grade-6 { color: #ef4444; }
      .sondage-results .distribution-grid thead .grade-7 { color: #b91c1c; }
      .sondage-results .results-footer {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
      }
      .sondage-results .results-footer button {
        padding: 0.45rem 1rem;
        cursor: pointer;
        font: inherit;
        border-radius: 6px;
        border: 1px solid var(--btn-secondary-border);
        background: var(--btn-secondary-bg);
        color: var(--btn-secondary-text);
      }
      .sondage-results .results-footer button:hover {
        background: var(--surface-hover);
      }
      .sondage-results .auto-hint {
        font-size: 0.8rem;
        color: var(--text-subtle);
      }
      .sondage-results .error {
        color: var(--error);
      }
    </style>
    <script src="sondage-auth-storage.js"></script>
    <script src="sondage-shell.js"></script>
    <script src="sondage-datetime.js"></script>
    <script src="sondage-refresh-interval.js"></script>
    <script src="sondage-poll-picker.js"></script>
    <script src="sondage-results.js"></script>
  </head>
  <body>
    <h1>Résultats du sondage</h1>
    <p id="help" class="sondage-poll-ref"></p>
    <p id="change-poll-wrap" style="display: none">
      <button type="button" id="change-poll-btn" class="sondage-change-poll-btn">
        Changer de sondage
      </button>
    </p>
    <div id="poll-picker-host"></div>
    <div id="results-host"></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var pollId = params.get("pollId");
        var help = document.getElementById("help");
        var pickerHost = document.getElementById("poll-picker-host");
        var host = document.getElementById("results-host");

        if (!pollId && window.SondageShell) {
          pollId = SondageShell.getActivePollId();
          if (pollId) {
            window.location.replace(
              "results.html?pollId=" + encodeURIComponent(pollId)
            );
            return;
          }
        }

        if (!pollId) {
          help.textContent = "Aucun sondage sélectionné";
          host.style.display = "none";
          SondageShell.init({ active: "results" });
          SondagePollPicker.mount({
            host: pickerHost,
            mode: "results",
            targetPage: "results.html",
          });
          return;
        }

        pickerHost.style.display = "none";
        if (window.SondageShell) {
          SondageShell.setActivePollId(pollId);
        }
        help.textContent = "Sondage : " + pollId;
        document.getElementById("change-poll-wrap").style.display = "block";
        document.getElementById("change-poll-btn").addEventListener("click", function () {
          SondageShell.goToPollPicker("results.html");
        });

        var widget = document.createElement("sondage-results-widget");
        widget.setAttribute("data-poll-id", pollId);
        widget.setAttribute("data-api-base", window.location.origin);
        widget.setAttribute("data-data-region", "EU");

        widget.addEventListener("sondage-poll-status", function (ev) {
          var ended = ev.detail && ev.detail.ended;
          if (ended) {
            document.title = "Résultats finaux — Sondage MJ";
            var h1 = document.querySelector("h1");
            if (h1) h1.textContent = "Résultats finaux";
          }
        });

        host.appendChild(widget);
        SondageShell.init({ active: "results" });
      })();
    </script>
  </body>
</html>
